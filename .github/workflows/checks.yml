name: Backend checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: for f in frontend/*.js; do node --check "$f"; done
      - run: uv run pytest tests/unit
      - run: docker compose up -d --wait db object-store
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/integration tests/contract tests/e2e
      - run: uv run python -m evals.run --suite synthetic --provider stub --output artifacts/eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-evaluation
          path: artifacts/eval.json
          if-no-files-found: ignore

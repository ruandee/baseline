services:
  db:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: patient_memory
      POSTGRES_PASSWORD: synthetic-admin
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patient_memory"]
      interval: 2s
      timeout: 3s
      retries: 30
  object-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: synthetic-local
      MINIO_ROOT_PASSWORD: synthetic-local-secret
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["objects:/data"]
volumes:
  pgdata:
  objects:

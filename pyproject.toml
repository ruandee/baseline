[project]
name = "patient-memory-backend"
version = "0.1.0"
description = "Synthetic patient memory research backend"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "sqlalchemy>=2.0,<3",
  "boto3>=1.37,<2", "pyjwt[crypto]>=2.10,<3", "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patient_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
